[workspace]
members = [
    "crates/code-kb-core",
    "crates/code-kb-cli",
]
resolver = "2"

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anortham/code-kb"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "limits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ignore = "0.4.33"
notify = "8.0"
notify-debouncer-full = "0.7"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dunce = "1.0"
url = "2.5"
which = "7.0"
blake3 = "1.5"
tempfile = "3.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
