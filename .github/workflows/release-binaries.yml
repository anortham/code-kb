name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1)"
        required: true
        default: "1.1.4"
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-release:
    name: Verify release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require matching release version and green CI
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          claude_plugin_version="$(jq -r .version .claude-plugin/plugin.json)"
          codex_plugin_version="$(jq -r .version .codex-plugin/plugin.json)"
          marketplace_version="$(jq -r '.plugins[] | select(.name == "code-kb") | .version' .claude-plugin/marketplace.json)"
          root_plugin_version="$(jq -r .version plugin.json)"
          if [[ "$version" != "$cargo_version" || "$version" != "$claude_plugin_version" || "$version" != "$codex_plugin_version" || "$version" != "$marketplace_version" || "$version" != "$root_plugin_version" ]]; then
            echo "Release version $version must match Cargo and all plugin manifests" >&2
            exit 1
          fi
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          ci_status="$(gh run list --workflow=ci.yml --commit "$commit" --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')"
          if [[ "$ci_status" != "completed/success" ]]; then
            echo "CI for $commit is '$ci_status', not completed/success" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe_suffix: ".exe"

    steps:
      - name: Checkout code-kb
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            echo "Release version could not be resolved" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore julie-extract
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh scripts/restore-julie-extract.ps1
          else
            bash scripts/restore-julie-extract.sh
          fi
          echo "$PWD/.tools" >> "$GITHUB_PATH"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p code-kb-cli --bin code-kb

      - name: Stage release package
        id: stage
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="target/package/code-kb-v${VERSION}-${{ matrix.target }}"
          mkdir -p "$PKG_DIR"

          BIN_SRC="target/${{ matrix.target }}/release/code-kb${{ matrix.exe_suffix }}"
          cp "$BIN_SRC" "$PKG_DIR/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$PKG_DIR/"

          # Bundle pre-built matching julie-extract binary into release package
          EXTRACT_BIN=".tools/julie-extract${{ matrix.exe_suffix }}"
          if [[ ! -f "$EXTRACT_BIN" ]]; then
            echo "error: required julie-extract binary not found at $EXTRACT_BIN" >&2
            exit 1
          fi
          cp "$EXTRACT_BIN" "$PKG_DIR/"
          echo "Bundled julie-extract binary into release package"

          echo "pkg_dir=$PKG_DIR" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="${{ steps.stage.outputs.pkg_dir }}"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ARCHIVE="code-kb-v${VERSION}-${{ matrix.target }}.zip"
            (cd "$PKG_DIR" && 7z a "$GITHUB_WORKSPACE/$ARCHIVE" .)
          else
            ARCHIVE="code-kb-v${VERSION}-${{ matrix.target }}.tar.gz"
            tar -czf "$ARCHIVE" -C "$PKG_DIR" .
          fi

          # Generate SHA256 checksum
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Flatten release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Check for release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="docs/release-notes/v${VERSION}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "code-kb v${{ steps.version.outputs.version }}"
          files: dist/*
          draft: false
          prerelease: false
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: ${{ steps.release_notes.outputs.found != 'true' }}
