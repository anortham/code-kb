name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    env:
      CODE_KB_ALLOW_MISSING_JULIE_EXTRACT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Sync Contract (AGENTS.md vs CLAUDE.md)
        if: ${{ !cancelled() }}
        run: cmp AGENTS.md CLAUDE.md
      - name: Restore julie-extract
        if: ${{ !cancelled() }}
        run: bash scripts/restore-julie-extract.sh
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core Package Verification
        if: ${{ !cancelled() }}
        run: cargo package -p code-kb-core --locked

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore julie-extract
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pwsh scripts/restore-julie-extract.ps1
          else
            bash scripts/restore-julie-extract.sh
          fi
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Run Tests
        run: cargo test --workspace --locked

